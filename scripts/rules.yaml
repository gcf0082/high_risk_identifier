# =============================================================================
# 高风险操作识别规则  v4.0
# -----------------------------------------------------------------------------
# 8 类结构：命令执行、文件操作、文件写、创建目录、删除文件、网络操作、压缩解压、网络监听
# =============================================================================

rules:

  - id: COMMAND-EXEC
    name: 命令执行
    severity: high
    match:
      - ext: [py]
        content:
          - 'os\.system\('
          - 'os\.popen\('
          - 'os\.exe'
          - 'os\.posix_spawn'
          - 'pty\.spawn'
          - 'pty\.fork'
          - 'pexpect\.spawn'
          - 'subprocess'
          - 'shell\s*=\s*True'
          - 'commands\.(getoutput|getstatusoutput|getstatus)'
          - '\bpopen\b'
          - 'invoke\.invoke'
          - 'exec_command'
          - 'sh -c'
          - 'bash -c'
      - ext: [js, ts]
        content:
          - 'child_process\.(exec|execSync|execFile|execFileSync|spawn|spawnSync|fork)'
          - '\bexeca\b'
          - 'shelljs\.exec'
          - 'shell\.exec'
          - 'sudo-prompt'
          - 'node-cmd'
          - 'sh -c'
          - 'bash -c'
          - 'cmd /c'
          - 'powershell -Command'
      - ext: [java]
        content:
          - 'Runtime\.getRuntime\(\)\.exec'
          - 'ProcessBuilder'
          - 'ProcessBuilder\.start'
          - 'DefaultExecutor'
          - 'CommandLineParser'
          - 'UNIXProcess\.forkAndExec'
          - 'Session\.execCommand'
          - 'Session\.exec'
          - 'ChannelExec\.setCommand'
          - 'com\.huawei\.baize\.security\.cmd\.SecureCmdExecutor'
          - 'PsExec'
          - 'sh -c'
          - 'bash -c'
          - 'cmd /c'
          - 'powershell -Command'
      - ext: [go]
        content:
          - 'exec\.Command'
          - 'exec\.CommandContext'
          - 'syscall\.Exec'
          - 'syscall\.StartProcess'
          - 'syscall\.ForkExec'
          - 'os\.StartProcess'
          - 'cmd\.Run\('
          - 'cmd\.Start\('
          - 'cmd\.Output\('
          - 'cmd\.CombinedOutput\('
          - 'sh -c'
          - 'bash -c'
      - ext: [rs]
        content:
          - 'std::process::Command'
          - 'libc::system'
          - 'CommandExt::exec'
          - 'libc::exe'
          - 'duct::'
          - 'subprocess::'
      - ext: [c, cpp, cc, h, hpp]
        content:
          - '\bsystem\('
          - 'popen\('
          - 'execl\('
          - 'execv\('
          - 'execvpe\('
          - 'exec(l|v)[pel]\('
          - 'posix_spawn'
          - 'CreateProcess'
          - 'CreateProcessAsUser'
          - 'CreateProcessWithLogon'
          - 'WinExec\('
          - 'ShellExecute'
          - 'ShellExecuteEx'
          - '_spawn'
          - 'spawn'
          - 'sh -c'
          - 'bash -c'
          - 'cmd /c'
          - 'powershell -Command'
          - 'iMAPGlobalUtils::runZipCmd'
          - 'NSTE_util::execCMD'
          - 'SecurityUtils::execSystemCommand'
          - 'SystemCmd::systemAsyncCmd'
          - 'iMAPGlobalUtils::global_execve_s'
          - 'EmfGetExecResult'
          - 'command_line\('
      - ext: [py, js, ts, go, java, rs, c, cpp, cc, h, hpp]
        content:
          - '\bopenssl\b'
          - '\bkeytool\b'
          - '\bgpg\b'
          - '\bsudo\b'
          - '\bsu\s+'
          - '\bpexpect\b'
          - '\bsshpass\b'
          - '\bchmod\b'
          - '\bchown\b'
          - '\bcurl\b'
          - '\bwget\b'
          - '\bscp\b'
          - '\bmkdir\b'
          - '\brm\s+'
          - '\bcp\s+'
          - '\bgrep\s+'
          - '\bifconfig\b'
          - '\.sh\b'
          - 'sh -c'
          - 'bash -c'
          - 'cmd /c'
          - 'powershell -Command'
      - ext: [js, ts, go, java, rs, c, cpp, cc, h, hpp]
        content:
          - '/bin/'

  - id: CODE-EXEC
    name: 代码执行
    severity: high
    match:
      - ext: [py]
        content:
          - '\beval\('
          - '\bexec\('
          - 'execfile'
      - ext: [js, ts]
        content:
          - 'eval\('
          - 'vm\.runIn'
      - ext: [java]
        content:
          - 'Runtime\.getRuntime\(\)\.load'
          - 'ScriptEngine(Manager)?\b'
          - 'javax\.script'
          - 'Groovy(Shell|ClassLoader|ScriptEngine)\b'
          - 'bsh\.Interpreter'
          - 'JShell\b|jdk\.jshell'
          - 'GroovyShell\.run'
          - 'groovy\.lang\.Script'
      - ext: [go]
        content:
          - 'plugin\.Open'
      - ext: [c, cpp, cc, h, hpp]
        content:
          - 'dlopen\('

  - id: FILE-OPERATION
    name: 文件操作
    severity: high
    match:
      - ext: [py, js, ts, go, java, rs, c, cpp, cc, h, hpp]
        content:
          - '\bchmod\b'
          - '\bchown\b'
          - 'os\.chmod|os\.chown'
          - 'fs\.chmod'
          - 'setExecutable|setWritable|setPosixFilePermissions'

  - id: FILE-WRITE
    name: 文件写
    severity: high
    match:
      - ext: [py]
        content: ['open\([^)]*["\x27][wa]\+?["\x27]', 'shutil\.copy']
      - ext: [js, ts]
        content: ['fs\.writeFile', 'fs\.appendFile', 'createWriteStream']
      - ext: [java]
        content: ['FileOutputStream', 'FileWriter', 'Files\.write', 'RandomAccessFile']
      - ext: [go]
        content: ['os\.Create', 'os\.WriteFile', 'ioutil\.WriteFile']
      - ext: [rs]
        content: ['fs::write', 'File::create']
      - ext: [c, cpp, cc, h, hpp]
        content: ['fopen\([^)]*["\x27][wa]\+?["\x27]']

  - id: DIR-CREATE
    name: 创建目录
    severity: high
    match:
      - ext: [py]
        content: ['os\.mkdir', 'os\.makedirs', 'os\.mkdtemp']
      - ext: [js, ts]
        content: ['fs\.mkdir', 'fs\.mkdirSync', 'fs\.mkdtemp']
      - ext: [java]
        content: ['Files\.createDirectory', 'Files\.createDirectories', 'File\.mkdir']
      - ext: [go]
        content: ['os\.Mkdir', 'os\.MkdirAll']
      - ext: [c, cpp, cc, h, hpp]
        content: ['mkdir\(']

  - id: FILE-DELETE
    name: 删除文件
    severity: high
    match:
      - ext: [py]
        content: ['shutil\.rmtree', 'os\.remove', 'os\.unlink', 'os\.rmdir', 'os\.removedirs', '\.unlink\(']
      - ext: [js, ts]
        content: ['fs\.rmSync', 'fs\.unlinkSync', 'fs\.rm\b\(', 'fs\.rmdirSync', 'rimraf']
      - ext: [java]
        content: ['Files\.delete', 'Files\.deleteIfExists', 'FileUtils\.delete']
      - ext: [go]
        content: ['os\.RemoveAll', 'os\.Remove']
      - ext: [rs]
        content: ['std::fs::remove_dir_all', 'std::fs::remove_file', 'std::fs::remove_dir']
      - ext: [c, cpp, cc, h, hpp]
        content: ['\bremove\(', '\bunlink\(', '\brmdir\(']

  - id: NETWORK-SEND-REQUEST
    name: 网络发送请求
    severity: high
    match:
      - ext: [py]
        content:
          - '\brequests\.'
          - '\brequests\.Session'
          - '\brequests\.get'
          - '\brequests\.post'
          - 'httpx\.'
          - 'httpx\.AsyncClient'
          - 'urlretrieve'
          - 'urlopen'
          - 'urllib\.request'
          - 'urllib2'
          - 'urllib3'
          - 'http\.client'
          - 'httplib'
          - 'aiohttp'
          - 'aiohttp\.ClientSession'
          - 'pycurl'
          - 'websocket'
          - 'websockets'
          - 'socketio'
          - 'paho\.mqtt'
          - 'tornado\.httpclient'
      - ext: [js, ts]
        content:
          - 'axios\.'
          - '\bfetch\('
          - 'node-fetch'
          - 'superagent'
          - '\bgot\('
          - '\bgot\.'
          - 'ky\('
          - 'ky\.'
          - 'needle'
          - 'undici'
          - 'XMLHttpRequest'
          - 'new\s+WebSocket'
          - 'ws\('
          - 'http\.request'
          - 'https\.request'
          - '\$\.ajax'
          - 'graphql-request'
          - 'apollo-client'
          - '@apollo/client'
          - 'socket\.io-client'
      - ext: [go]
        content:
          - '\bhttp\.'
          - 'http\.Get'
          - 'http\.Post'
          - 'http\.PostForm'
          - 'http\.Do'
          - 'http\.Client'
          - 'http\.NewRequest'
          - 'net/http'
          - 'fasthttp'
          - 'grpc\.'
          - 'resty\.'
          - 'colly\.'
          - 'websocket\.DefaultDialer'
          - 'websocket\.Dial'
          - 'urlfetch\.'
      - ext: [java]
        content:
          - 'HttpURLConnection\.connect'
          - 'HttpsURLConnection'
          - 'URL\.openConnection'
          - 'java\.net\.http\.HttpClient'
          - 'HttpRequest\.newBuilder'
          - 'CloseableHttpClient'
          - 'HttpClients\.custom'
          - 'HttpClientBuilder'
          - 'WebClient\.create'
          - 'RestTemplate\.'
          - 'Feign\.builder'
          - '@FeignClient'
          - 'Retrofit\.Builder'
          - 'OkHttpClient\.newCall'
          - 'ClientBuilder\.newClient'
          - 'WebTarget\.request'
          - 'AsyncHttpClient'
          - 'JettyHttpClient'
      - ext: [rs]
        content:
          - 'reqwest::'
          - 'hyper::'
          - 'ureq::'
          - 'awc::'
          - 'surf::'
          - 'isahc::'
          - 'attohttpc::'
          - 'curl::'
          - 'tungstenite::'
      - ext: [c, cpp, cc, h, hpp]
        content:
          - 'curl_easy_'
          - 'CURLOPT_'
          - 'WinHttp'
          - 'WinInet'
          - 'QTcpSocket'
          - 'QNetwork'
          - 'QNetworkAccessManager'
          - 'boost::asio'
          - 'Poco::Net'
          - 'CInternetSession'
          - 'CHttpConnection'
          - 'CFtpConnection'

  - id: ARCHIVE-EXTRACT
    name: 压缩解压
    severity: high
    match:
      - ext: [py, js, ts, go, java, rs, c, cpp, cc, h, hpp]
        content:
          - 'unzip\b'
          - 'unrar\b'
          - '\b7z\b'
          - '\btar\b'
          - 'extractall\('
          - '\btarfile\b|ZipFile|ZipInputStream|ZipArchive'

  - id: NETWORK-LISTEN
    name: 网络监听
    severity: high
    match:
      - ext: [py]
        content: ['socket\.socket', 'socket\.bind']
      - ext: [js, ts]
        content: ['net\.connect|net\.createConnection|createServer', 'new\s+WebSocket', 'dgram\.createSocket']
      - ext: [java]
        content: ['new\s+Socket', 'ServerSocket', 'HttpServer']
      - ext: [go]
        content: ['net\.Dial', 'net\.Listen', 'http\.ListenAndServe']
      - ext: [c, cpp, cc, h, hpp]
        content: ['\bsocket\(', '\blisten\(', '\baccept\(']

  - id: SHELL-SCRIPT
    name: Shell脚本高危操作
    severity: high
    match:
      - ext: [sh]
        content:
          - '\bchmod\b'
          - '\bcurl\b'
          - '\bwget\b'
          - '\beval\s+'
