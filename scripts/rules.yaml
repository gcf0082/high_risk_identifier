rules:

  - id: COMMAND-EXEC
    name: 命令执行
    severity: high
    match:
      - ext: [py]
        content:
          - 'os\.system\('
          - 'os\.popen\('
          - 'os\.exe'
          - 'os\.posix_spawn'
          - 'pty\.spawn'
          - 'pty\.fork'
          - 'pexpect\.spawn'
          - 'subprocess'
          - 'shell\s*=\s*True'
          - 'commands\.(getoutput|getstatusoutput|getstatus)'
          - '\bpopen\b'
          - 'invoke\.invoke'
          - 'exec_command'
          - 'sh -c'
      - ext: [js, ts]
        content:
          - 'child_process\.(exec|execSync|execFile|execFileSync|spawn|spawnSync|fork)'
          - '\bexeca\b'
          - 'shelljs\.exec'
          - 'shell\.exec'
          - 'sudo-prompt'
          - 'node-cmd'
          - 'sh -c'
          - 'cmd /c'
          - 'powershell -Command'
      - ext: [java]
        content:
          - 'Runtime\.getRuntime\(\)\.exec'
          - 'ProcessBuilder'
          - 'ProcessBuilder\.start'
          - 'DefaultExecutor'
          - 'CommandLineParser'
          - 'UNIXProcess\.forkAndExec'
          - 'Session\.execCommand'
          - 'Session\.exec'
          - 'ChannelExec\.setCommand'
          - 'com\.huawei\.baize\.security\.cmd\.SecureCmdExecutor'
          - 'PsExec'
          - 'sh -c'
          - 'cmd /c'
          - 'powershell -Command'
      - ext: [go]
        content:
          - 'exec\.Command'
          - 'syscall\.Exec'
          - 'syscall\.StartProcess'
          - 'syscall\.ForkExec'
          - 'os\.StartProcess'
          - 'cmd\.Run\('
          - 'cmd\.Start\('
          - 'cmd\.Output\('
          - 'cmd\.CombinedOutput\('
          - 'sh -c'
      - ext: [rs]
        content:
          - 'std::process::Command'
          - 'libc::system'
          - 'CommandExt::exec'
          - 'libc::exe'
          - 'duct::'
          - 'subprocess::'
      - ext: [c, cpp, cc, h, hpp]
        content:
          - '\bsystem\('
          - 'popen\('
          - 'execl\('
          - 'execv\('
          - 'execvpe\('
          - 'exec(l|v)[pel]\('
          - 'posix_spawn'
          - 'CreateProcess'
          - 'WinExec\('
          - 'ShellExecute'
          - '_spawn'
          - 'spawn'
          - 'sh -c'
          - 'cmd /c'
          - 'powershell -Command'
          - 'iMAPGlobalUtils::runZipCmd'
          - 'NSTE_util::execCMD'
          - 'SecurityUtils::execSystemCommand'
          - 'SystemCmd::systemAsyncCmd'
          - 'iMAPGlobalUtils::global_execve_s'
          - 'EmfGetExecResult'
          - 'command_line\('
      - ext: [py, js, ts, go, java, rs, c, cpp, cc, h, hpp]
        content:
          - '\bopenssl\b'
          - '\bkeytool\b'
          - '\bgpg\b'
          - '\bsudo\b'
          - '\bsu\s+'
          - '\bpexpect\b'
          - '\bsshpass\b'
          - '\bchmod\b'
          - '\bchown\b'
          - '\bcurl\b'
          - '\bwget\b'
          - '\bscp\b'
          - '\bmkdir\b'
          - '\brm -'
          - '\bcp -'
          - '\bgrep\s+'
          - '\bifconfig\b'
          - '\.sh\b'
          - 'sh -c'
          - 'cmd /c'
          - 'powershell'
      - ext: [js, ts, go, java, rs, c, cpp, cc, h, hpp]
        content:
          - '/bin/'

  - id: CODE-EXEC
    name: 代码执行
    severity: high
    match:
      - ext: [py]
        content:
          - '\beval\('
          - '\bexec\('
          - 'execfile'
          - 'ctypes\.CDLL'
          - 'ctypes\.cdll'
          - 'ctypes\.LoadLibrary'
          - 'ffi\.dlopen'
          - 'code\.InteractiveConsole'
          - 'code\.InteractiveInterpreter'
      - ext: [js, ts]
        content:
          - 'eval\('
          - 'vm\.runIn'
          - 'new\s+Function'
          - 'vm\.compileFunction'
      - ext: [java]
        content:
          - 'Runtime\.getRuntime\(\)\.load'
          - 'ScriptEngine(Manager)?\b'
          - 'javax\.script'
          - 'Groovy(Shell|ClassLoader|ScriptEngine)\b'
          - 'bsh\.Interpreter'
          - 'JShell\b|jdk\.jshell'
          - 'groovy\.lang\.Script'
          - 'System\.load'
          - 'NashornScriptEngine'
          - 'nashorn'
          - 'PythonInterpreter'
          - 'jython'
          - 'JRubyScriptEngine'
          - 'RubyScriptEngine'
          - 'JavaCompiler'
          - 'ToolProvider\.getSystemJavaCompiler'
      - ext: [go]
        content:
          - 'plugin\.Open'
          - 'goja\.'
          - 'otto\.'
          - 'lua\.NewState'
          - 'lua\.DoString'
          - 'lua\.DoFile'
          - 'yaegi\.'
          - 'interp\.New'
          - 'interp\.Eval'
          - 'starlark\.ExecFile'
          - 'tengo\.'
      - ext: [rs]
        content:
          - 'libloading::Library'
          - 'dylib::'
          - 'mlua::Lua'
          - 'rlua::Lua'
          - 'rhai::Engine'
          - 'deno_core::JsRuntime'
      - ext: [c, cpp, cc, h, hpp]
        content:
          - 'dlopen\('
          - 'LoadLibrary'
          - 'LoadLibraryEx'
          - 'luaL_loadstring'
          - 'luaL_dofile'
          - 'luaL_loadfile'
          - 'PyRun_SimpleString'
          - 'PyRun_SimpleFile'
          - 'duk_eval_string'
          - 'duk_peval_string'
          - 'JS_Eval'
          - 'v8::Script::Compile'
          - 'v8::Script::Run'

  - id: FILE-OPERATION
    name: 文件操作
    severity: high
    match:
      - ext: [py, js, ts, go, java, rs, c, cpp, cc, h, hpp]
        content:
          - '\bchmod\b'
          - '\bchown\b'
          - 'os\.chmod|os\.chown'
          - 'fs\.chmod'
          - 'setExecutable|setWritable|setPosixFilePermissions'

  - id: FILE-WRITE
    name: 文件写
    severity: high
    match:
      - ext: [py]
        content:
          - 'open\([^)]*["\x27][wax]'
          - 'shutil\.copy'
          - 'shutil\.move'
          - 'tempfile\.'
          - '.mkstemp'
          - 'fileinput\.input'
      - ext: [js, ts]
        content:
          - 'fs\.writeFile'
          - 'fs\.appendFile'
          - 'createWriteStream'
          - 'writeFileSync'
          - 'appendFileSync'
          - 'fs\.promises\.writeFile'
          - 'fs\.promises\.appendFile'
          - 'fs\.openSync\([^)]*["\x27][wax]'
          - 'fs\.writeSync'
          - 'fs\.writevSync'
          - 'outputFile'
          - 'moveSync'
          - 'copySync'
      - ext: [java]
        content:
          - 'FileOutputStream'
          - 'FileWriter'
          - 'Files\.write'
          - 'RandomAccessFile'
          - 'Files\.newOutputStream'
          - 'Files\.newBufferedWriter'
          - 'Files\.copy'
          - 'Files\.move'
          - 'FileChannel\.open'
          - 'File\.createNewFile'
          - 'Files\.createFile'
          - 'AsynchronousFileChannel'
      - ext: [go]
        content:
          - 'os\.Create'
          - 'os\.WriteFile'
          - 'ioutil\.WriteFile'
          - 'os\.OpenFile'
          - 'os\.CreateTemp'
          - 'ioutil\.TempFile'
          - 'os\.MkdirTemp'
          - 'os\.Truncate'
      - ext: [rs]
        content:
          - 'fs::write'
          - 'File::create'
          - 'std::fs::OpenOptions'
          - 'OpenOptions::new'
          - 'std::fs::copy'
          - 'std::fs::rename'
          - 'std::fs::File::options'
          - 'tempfile::NamedTempFile'
          - 'tempfile::tempfile'
      - ext: [c, cpp, cc, h, hpp]
        content:
          - 'fopen\([^)]*["\x27][wa]'
          - 'creat\('
          - 'creat64\('
          - 'open\([^)]*O_(WRONLY|RDWR|CREAT|TRUNC)'
          - 'tmpfile\('
          - 'mkstemp\('
          - 'mkstemps\('
          - 'CreateFile'
          - 'WriteFile'
          - 'CopyFile'
          - 'MoveFile'
          - 'SetEndOfFile'
          - 'std::ofstream'
          - 'std::fstream'
          - 'std::filesystem::copy'
          - 'std::filesystem::rename'
          - 'QFile'
          - 'QSaveFile'

  - id: DIR-CREATE
    name: 创建目录
    severity: high
    match:
      - ext: [py]
        content:
          - 'os\.makedirs'
          - 'os\.mkdtemp'
          - '\.mkdir\('
          - 'tempfile\.mkdtemp'
      - ext: [js, ts]
        content:
          - 'fs\.mkdir'
          - 'fs\.mkdtemp'
          - 'fs\.promises\.mkdir'
          - 'ensureDir'
          - 'mkdirp'
      - ext: [java]
        content:
          - 'Files\.createDirectory'
          - 'Files\.createDirectories'
          - 'File\.mkdir'
          - 'Files\.createTempDirectory'
      - ext: [go]
        content:
          - 'os\.Mkdir'
          - 'os\.MkdirTemp'
          - 'ioutil\.TempDir'
      - ext: [rs]
        content:
          - 'create_dir'
          - 'tempfile::tempdir'
      - ext: [c, cpp, cc, h, hpp]
        content:
          - 'mkdir\('
          - 'CreateDirectory'
          - 'create_directory'
          - create_directories'
          - '\.mkpath'

  - id: FILE-DELETE
    name: 删除文件
    severity: high
    match:
      - ext: [py]
        content:
          - 'shutil\.rmtree'
          - 'os\.remove'
          - 'os\.removedirs'
          - '\.unlink\('
          - '\.rmdir\('
      - ext: [js, ts]
        content:
          - 'fs\.rmSync'
          - 'fs\.unlinkSync'
          - 'fs\.rm\b\('
          - 'fs\.rmdirSync'
          - 'rimraf'
          - \.unlink'
          - '\.rmdir'
          - 'fs\.promises\.rm'
          - 'removeSync'
      - ext: [java]
        content:
          - 'Files\.deleteIfExists'
          - 'File\.deleteOnExit'
          - 'FileUtils\.deleteDirectory'
          - 'FileUtils\.deleteQuietly'
          - 'FileUtils\.cleanDirectory'
      - ext: [go]
        content:
          - 'os\.Remove'
      - ext: [rs]
        content:
          - 'remove_dir_all'
          - 'remove_file'
          - 'remove_dir'
      - ext: [c, cpp, cc, h, hpp]
        content:
          - '\bunlink\('
          - '\brmdir\('
          - 'DeleteFile'
          - 'RemoveDirectory'
          - 'remove_all'
          - 'QDir\(\)\.removeRecursively'

  - id: NETWORK-SEND-REQUEST
    name: 网络发送请求
    severity: high
    match:
      - ext: [py]
        content:
          - '\brequests\.'
          - 'httpx\.'
          - 'urlretrieve'
          - 'urlopen'
          - 'urllib\.request'
          - 'urllib2'
          - 'urllib3'
          - 'http\.client'
          - 'httplib'
          - 'aiohttp'
          - 'pycurl'
          - 'tornado\.httpclient'
      - ext: [js, ts]
        content:
          - 'axios\.'
          - '\bfetch\('
          - 'node-fetch'
          - 'superagent'
          - 'needle'
          - 'undici'
          - 'http\.request'
          - 'https\.request'
          - '\$\.ajax'
          - 'graphql-request'
          - 'apollo-client'
      - ext: [go]
        content:
          - '\bhttp\.'
          - 'net/http'
          - 'fasthttp'
          - 'grpc\.'
          - 'resty\.'
          - 'colly\.'
          - 'urlfetch\.'
      - ext: [java]
        content:
          - 'HttpURLConnection\.connect'
          - 'HttpsURLConnection'
          - 'URL\.openConnection'
          - 'java\.net\.http\.HttpClient'
          - 'HttpRequest\.newBuilder'
          - 'CloseableHttpClient'
          - 'HttpClients\.custom'
          - 'HttpClientBuilder'
          - 'RestTemplate\.'
          - 'Feign\.builder'
          - '@FeignClient'
          - 'Retrofit\.Builder'
          - 'OkHttpClient\.newCall'
          - 'ClientBuilder\.newClient'
          - 'WebTarget\.request'
          - 'AsyncHttpClient'
          - 'JettyHttpClient'
      - ext: [rs]
        content:
          - 'reqwest::'
          - 'hyper::'
          - 'ureq::'
          - 'awc::'
          - 'surf::'
          - 'isahc::'
          - 'attohttpc::'
          - 'curl::'
          - 'tungstenite::'
      - ext: [c, cpp, cc, h, hpp]
        content:
          - 'curl_easy_'
          - 'CURLOPT_'
          - 'WinHttp'
          - 'WinInet'
          - 'QTcpSocket'
          - 'QNetwork'
          - 'boost::asio'
          - 'Poco::Net'
          - 'CInternetSession'
          - 'CHttpConnection'
          - 'CFtpConnection'

  - id: ARCHIVE-EXTRACT
    name: 压缩解压
    severity: high
    match:
      - ext: [py, js, ts, go, java, rs, c, cpp, cc, h, hpp]
        content:
          - 'unzip\b'
          - 'unrar\b'
          - '\b7z\b'
          - '\btar\b'
          - 'extractall\('
          - '\btarfile\b|ZipFile|ZipInputStream|ZipArchive'

  - id: NETWORK-LISTEN
    name: 网络监听
    severity: high
    match:
      - ext: [py]
        content: ['socket\.socket', 'socket\.bind']
      - ext: [js, ts]
        content: ['net\.connect|net\.createConnection|createServer', 'new\s+WebSocket', 'dgram\.createSocket']
      - ext: [java]
        content: ['new\s+Socket', 'ServerSocket', 'HttpServer']
      - ext: [go]
        content: ['net\.Dial', 'net\.Listen', 'http\.ListenAndServe']
      - ext: [c, cpp, cc, h, hpp]
        content: ['\bsocket\(', '\blisten\(', '\baccept\(']

  - id: SHELL-SCRIPT
    name: Shell脚本高危操作
    severity: medium
    match:
      - ext: [sh]
        content:
          - '\bchmod\b'
          - '\bcurl\b'
          - '\bwget\b'
          - '\beval\s+'
